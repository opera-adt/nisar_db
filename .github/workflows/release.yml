name: Release NISAR DISP assets

# Build the Path-A release assets (frame-to-bounds, GSLC catalog, consistent-GSLC)
# and attach them to a GitHub Release when a v* tag is pushed.
#
# Required repository secrets (Earthdata Login, used to download the public
# NISAR TrackFrame database granule and to query CMR):
#   EARTHDATA_USERNAME
#   EARTHDATA_PASSWORD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      max_results:
        description: 'Max GSLC granules to pull from CMR for the catalog'
        required: false
        default: '25000'
      snow_geojson:
        description: >-
          Path (in the checkout) to a snow-analysis GeoJSON. When set, the
          blackout dates are rebuilt from it instead of carried forward from
          the previous release.
        required: false
        default: ''

permissions:
  contents: write

env:
  # CMR concept-id of the public NISAR TrackFrame database granule.
  NISAR_DB_GRANULE_ID: G3817504902-ASF
  MAX_RESULTS: ${{ github.event.inputs.max_results || '25000' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Configure Earthdata credentials
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          if [ -z "$EARTHDATA_USERNAME" ] || [ -z "$EARTHDATA_PASSWORD" ]; then
            echo "::error::EARTHDATA_USERNAME / EARTHDATA_PASSWORD secrets are required."
            exit 1
          fi
          umask 177
          cat > "$HOME/.netrc" <<EOF
          machine urs.earthdata.nasa.gov login $EARTHDATA_USERNAME password $EARTHDATA_PASSWORD
          EOF

      - name: Resolve version/date
        id: meta
        run: |
          echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download NISAR TrackFrame database (public granule)
        run: |
          nisar-db download-frame-db --granule-id "$NISAR_DB_GRANULE_ID"
          # Later steps reference a date-independent name.
          cp NISAR_TrackFrame_L_*.gpkg NISAR_TrackFrame_L.gpkg

      - name: Build frame-to-bounds and frame-geometry assets
        run: |
          nisar-db create-frame-to-bound \
            --nisar-gpkg NISAR_TrackFrame_L.gpkg \
            --output opera-nisar-disp-frame-to-bounds-${{ steps.meta.outputs.date }}.json \
            --geojson opera-nisar-disp-frame-geometries-simple-${{ steps.meta.outputs.version }}.geojson

      - name: Build GSLC file list from CMR
        run: |
          nisar-db search --product-type GSLC --url-type s3 \
            --max-results "${MAX_RESULTS}" --output-csv gslc_search.csv
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("gslc_search.csv")
          urls = df["url"].dropna().astype(str)
          urls = urls[urls.str.startswith("s3://")]
          urls.to_csv("gslc_files.txt", index=False, header=False)
          print(f"Wrote {len(urls)} GSLC S3 paths to gslc_files.txt")
          PY

      - name: Build GSLC catalog (North America only)
        run: |
          nisar-db create-catalog \
            --input gslc_files.txt \
            --output gslc_catalog.csv \
            --na-only --nisar-gpkg NISAR_TrackFrame_L.gpkg

      # Blackout windows are climatological, so they are not rebuilt every
      # release: a new snow analysis produces them, otherwise the previous
      # release's file is carried forward.
      - name: Resolve blackout-dates asset
        env:
          GH_TOKEN: ${{ github.token }}
          SNOW_GEOJSON: ${{ github.event.inputs.snow_geojson }}
        run: |
          BLACKOUT=opera-nisar-disp-blackout-dates-${{ steps.meta.outputs.date }}.json
          if [ -n "$SNOW_GEOJSON" ] && [ -f "$SNOW_GEOJSON" ]; then
            echo "Deriving blackout dates from $SNOW_GEOJSON"
            nisar-db create-blackout-dates --input-file "$SNOW_GEOJSON" --output-file "$BLACKOUT"
          elif gh release download --pattern 'opera-nisar-disp-blackout-dates-*.json' \
                 --dir prev-blackout 2>/dev/null; then
            echo "Reusing blackout dates from the previous release"
            cp prev-blackout/opera-nisar-disp-blackout-dates-*.json "$BLACKOUT"
          else
            echo "No snow analysis and no previous release; using default seasonal windows"
            nisar-db create-blackout-dates --manual --output-file "$BLACKOUT"
          fi
          echo "BLACKOUT=$BLACKOUT" >> "$GITHUB_ENV"

      - name: Build consistent-GSLC assets
        run: |
          nisar-db create-consistent \
            --catalog gslc_catalog.csv \
            --nisar-gpkg opera-nisar-disp-frames.gpkg \
            --output opera-nisar-disp-consistent-gslc-no-blackout.json
          nisar-db create-consistent \
            --catalog gslc_catalog.csv \
            --nisar-gpkg opera-nisar-disp-frames.gpkg \
            --blackout-file "$BLACKOUT" \
            --output opera-nisar-disp-consistent-gslc-${{ steps.meta.outputs.date }}.json

      - name: Label processing modes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_ARG=""
          if gh release download --pattern 'opera-nisar-disp-consistent-gslc-2*.json' \
               --dir prev-consistent 2>/dev/null; then
            PREV=$(ls prev-consistent/*.json | head -n1)
            PREV_ARG="--previous-json $PREV"
            echo "Diffing against $PREV"
          fi
          nisar-db label-processing-mode \
            --consistent-json opera-nisar-disp-consistent-gslc-${{ steps.meta.outputs.date }}.json \
            $PREV_ARG \
            --output opera-nisar-disp-consistent-gslc-with-processing-mode-${{ steps.meta.outputs.date }}.json

      - name: Build reference-dates asset
        run: |
          nisar-db create-reference-dates \
            --consistent-json opera-nisar-disp-consistent-gslc-${{ steps.meta.outputs.date }}.json \
            --blackout-file "$BLACKOUT" \
            --output opera-nisar-disp-reference-dates-${{ steps.meta.outputs.date }}.json

      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.meta.outputs.date }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "nisar_db ${VERSION}" \
            --generate-notes \
            "opera-nisar-disp-frame-to-bounds-${DATE}.json" \
            "opera-nisar-disp-frame-to-bounds-${DATE}.json.zip" \
            "opera-nisar-disp-frame-geometries-simple-${VERSION}.geojson.zip" \
            "${BLACKOUT}" \
            "${BLACKOUT}.zip" \
            "opera-nisar-disp-consistent-gslc-${DATE}.json" \
            "opera-nisar-disp-consistent-gslc-${DATE}.json.zip" \
            opera-nisar-disp-consistent-gslc-no-blackout.json \
            "opera-nisar-disp-consistent-gslc-with-processing-mode-${DATE}.json" \
            "opera-nisar-disp-consistent-gslc-with-processing-mode-${DATE}.json.zip" \
            "opera-nisar-disp-reference-dates-${DATE}.json" \
            "opera-nisar-disp-reference-dates-${DATE}.json.zip" \
            gslc_catalog.csv
