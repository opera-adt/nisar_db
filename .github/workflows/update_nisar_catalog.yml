name: Update NISAR Catalog

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install duckdb pandas

      - name: Update GSLC catalog
        run: |
          python -m nisar_db.catalog.create_gslc_catalog --output-dir catalog --db-path gslc_catalog.duckdb

      - name: Update GUNW catalog
        run: |
          python -m nisar_db.catalog.create_gunw_catalog --output-dir catalog --db-path gunw_catalog.duckdb

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'

          # Check if there are changes to commit
          if [[ -n $(git status -s) ]]; then
            git add catalog/*.json
            git commit -m "Update NISAR catalog [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
