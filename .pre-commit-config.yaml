ci:
  autofix_prs: false

# `pre-commit install` wires up both the per-commit hooks and the pre-push gate
# (lint/format/type on every commit; the full test suite additionally on push).
default_install_hook_types: [pre-commit, pre-push]

# Experimental notebooks / scratch scripts are not part of the package and
# are not held to the package's lint/type standards.
exclude: ^notebooks/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-yaml
        # --unsafe allows mkdocs.yml's `!!python/name:` tags (pymdownx superfences)
        args: [--allow-multiple-documents, --unsafe]
      - id: debug-statements
      - id: end-of-file-fixer
      - id: file-contents-sorter
        files: (requirements.txt)$
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: "26.1.0"
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --show-fixes]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v1.19.1"
    hooks:
      - id: mypy
        additional_dependencies:
        - types-setuptools
        - types-requests
        - types-python-dateutil

  # Full test suite runs on `git push` only (too slow for every commit). Uses the
  # pytest on PATH, so run pushes from the project env (e.g. nisar-db-env).
  - repo: local
    hooks:
      - id: pytest
        name: pytest (full suite)
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
