{% set name = "nisar_db" %}
{% set version = environ.get("NISAR_DB_VERSION", "0.0.0.dev0") %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # setuptools_scm cannot read a version from the copied source tree, so the
  # recipe version is handed to the build via the environment.
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  entry_points:
    - nisar-db = nisar_db.cli:cli_app

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=64
    - setuptools_scm >=6.2
  run:
    - python >=3.9
    - boto3 >=1.26.0
    - click >=8.0.0
    - duckdb >=0.9.0
    - geopandas >=0.10.0
    - numpy >=1.20.0
    - pandas >=1.3.0
    - pyarrow >=10.0.0
    # geopandas ships no vector IO engine of its own; the GPKG path needs one
    - pyogrio
    - requests >=2.25.0
    - shapely >=1.8.0
    - tqdm >=4.60.0
    - unzip-http >=0.2.0

test:
  requires:
    - pip
  imports:
    - nisar_db
  commands:
    - pip check
    - nisar-db --help

about:
  home: https://github.com/opera-adt/nisar_db
  summary: NISAR Frame database generation for OPERA DISP-NISAR
  description: |
    Frame database and product-catalog generation for OPERA DISP-NISAR:
    frame-to-bounds maps, GSLC/GUNW catalogs, consistent-GSLC lists and
    blackout dates, exposed through the `nisar-db` command line tool.
  license: BSD-3-Clause OR Apache-2.0
  license_family: OTHER
  license_file: LICENSE
  doc_url: https://opera-adt.github.io/nisar_db/
  dev_url: https://github.com/opera-adt/nisar_db

extra:
  recipe-maintainers:
    - mgovorcin
