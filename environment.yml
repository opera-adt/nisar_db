name: nisar-db-env
channels:
  - conda-forge
dependencies:
  - python>=3.10
  # Runtime only (mirrors requirements.txt). Development tooling lives in the
  # pyproject extras: `pip install -e ".[dev]"` after creating this env.
  - boto3
  - click
  - duckdb
  - geopandas-base
  - numpy
  - pandas
  - pip
  - pyarrow
  # geopandas-base ships no vector IO engine; the GPKG read/write path needs one
  - pyogrio
  - requests
  - shapely
  - tqdm
  - unzip-http
