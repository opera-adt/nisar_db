site_name: OPERA NISAR-DB
site_description: >-
  Frame database and product-catalog generation for OPERA DISP-NISAR.
  Mirrors the burst_db workflow used for Sentinel-1 (DISP-S1).
site_url: https://opera-adt.github.io/nisar_db/
repo_url: https://github.com/opera-adt/nisar_db
repo_name: opera-adt/nisar_db
edit_uri: edit/main/docs/

# Flat output paths (page.html instead of page/index.html) so that the raw
# <iframe> in frame-viewer.md and its markdown links resolve to the same
# relative assets/ directory.
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Background:
      - Consistent mode: background/consistent-mode.md
      - Blackout dates: background/blackout-dates.md
      - Reference (reset) dates: background/reference-dates.md
      - Processing modes: background/processing-modes.md
      - CMR UMM-JSON drops: background/cmr-umm-json-drops.md
      - NISAR product metadata: background/nisar-product-metadata.md
      - Metadata for the viewer: background/viewer-metadata-candidates.md
  - Product layouts:
      - RSLC: products/rslc.md
      - GSLC: products/gslc.md
      - GUNW: products/gunw.md
      - GOFF: products/goff.md
  - Tutorials:
      - Build a consistent-mode database: tutorials/consistent-mode-database.md
      - Derive blackout dates from snow cover: tutorials/snow-analysis.md
  - Frame viewer:
      - Frame viewer: frame-viewer.md
      - Viewer data sources: data-sources.md
  - REST API: api.md
  - MCP server (AI): mcp.md
  - OPERA project ↗: https://www.jpl.nasa.gov/go/opera/

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra_css:
  - stylesheets/opera.css

extra:
  social:
    - icon: material/earth
      link: https://www.jpl.nasa.gov/go/opera/
      name: OPERA project at JPL
    - icon: fontawesome/brands/github
      link: https://github.com/opera-adt
      name: OPERA on GitHub

copyright: >-
  Part of <a href="https://www.jpl.nasa.gov/go/opera/">OPERA</a> (Observational
  Products for End-Users from Remote Sensing Analysis), a project at NASA's Jet
  Propulsion Laboratory.
