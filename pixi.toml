[project]
name = "nisar-db"
version = "0.1.0"
description = "NISAR Frame database generation for OPERA DISP-NISAR"
authors = ["Marijan Govorcin <marijan.govorcin@jpl.nasa.gov>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tasks]
lint = "pre-commit run --all-files"
tests = "pytest -xvs tests"
check = "mypy src/"
build = "pip install -e ."
create-frame-to-bound = "nisar-db create-frame-to-bound"
create-catalog = "nisar-db create-catalog"
create-consistent = "nisar-db create-consistent"

[dependencies]
python = ">=3.9,<3.12"
click = "*"
geopandas = "*"
numpy = "*"
pandas = "*"
requests = "*"
shapely = "*"
tqdm = "*"

[feature.dev.dependencies]
pytest = "*"
pre-commit = "*"
mypy = "*"
black = "*"
ruff = "*"