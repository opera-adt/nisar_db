[build-system]
requires = ["setuptools>=64.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "nisar_db"
authors = [
  { name = "Marijan Govorcin", email = "marijan.govorcin@jpl.nasa.gov" },
]
description = "NISAR Frame database generation for OPERA DISP-NISAR"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: GIS",
]
keywords = ["NISAR", "OPERA", "InSAR", "DISP", "frame database"]
license = { file = "LICENSE" }

# The version will be written into a version.py upon install, auto-generated
# see section: setuptools_scm
# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html#dynamic-metadata
# dependencies will be read from text files
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-randomly", "pytest-cov"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5", "pymdown-extensions>=10"]
publish = ["build>=1.0", "twine>=5.0"]
# Everything needed to work on the package; the conda environment.yml stays
# runtime-only so plain users do not pull the tooling in.
lint = ["black", "mypy", "pre-commit", "ruff"]
dev = ["nisar_db[test,docs,publish,lint]"]

[project.urls]
Homepage = "https://github.com/opera-adt/nisar_db"
"Bug Tracker" = "https://github.com/opera-adt/nisar_db/issues"

# Entry points for the command line interface
[project.scripts]
nisar-db = "nisar_db.cli:cli_app"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools_scm]
# https://github.com/pypa/setuptools_scm#configuration-parameters
write_to = "src/nisar_db/_version.py"
# https://github.com/pypa/setuptools_scm#version-number-construction
version_scheme = "no-guess-dev" # Will not guess the next version

[tool.ruff]
src = ["src"]       # For known-first-party imports
unsafe-fixes = true

[tool.ruff.lint]
select = [
  "A",   # flake8-builtins
  "ARG", # flake8-unused-arguments
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle (errors)
  "W",   # pycodestyle (warnings)
  "EXE", # flake8-executable
  "F",   # Pyflakes
  "I",   # isort
  "ISC", # flake8-implicit-str-concat
  "N",   # pep8-naming
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie
  "PL",  # Pylint
  "PTH", # flake8-use-pathlib
  "PYI", # flake8-pyi
  "RUF", # Ruff-specific rules
  "SIM", # flake8-simplify
  "TRY", # tryceratops
  "YTT", # flake8-2020
]

ignore = [
  "D100",    # Missing docstring in public module
  "D104",    # Missing docstring in public package
  "D105",    # Missing docstring in magic method
  "D203",    # 1 blank line required before class docstring
  "D213",    # Multi-line docstring summary should start at the second line
  "N803",    # Argument name should be lowercase
  "N806",    # Variable _ in function should be lowercase
  "PIE796",  # Non-unique values are redundant and likely a mistake.
  "PLR",     # Pylint Refactor
  "PTH123",  # `open()` should be replaced by `Path.open()`
  "PTH207",  # "Replace `glob` with `Path.glob` or `Path.rglob`
  "ISC001",  # The following rules may cause conflicts when used with the formatter
  "TRY003",  # Avoid specifying long messages outside the exception
  "PLC0415", # import should be at top level
]

exclude = ["scripts"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"tests/**" = ["D", "N", "PTH"]
"scripts/**" = ["ALL"]

[tool.ruff.lint.flake8-unused-arguments]
# Whether to allow unused variadic arguments, like *args and **kwargs.
ignore-variadic-names = true

[tool.black]
preview = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
doctest_optionflags = "NORMALIZE_WHITESPACE NUMBER"
addopts = " --doctest-modules --randomly-seed=1234 --ignore=scripts --ignore=docs --ignore=data"
filterwarnings = ["error"]
